name: claudaris-ci
on:
  push:
  pull_request:
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            build_type: Debug
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            build_type: Release
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            build_type: Debug
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            build_type: Release
          - os: windows-latest
            compiler: msvc
            cc: cl
            build_type: Debug
          - os: windows-latest
            compiler: msvc
            cc: cl
            build_type: Release
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.compiler != 'msvc'
        run: cmake -S . -B build -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCLAUDARIS_BUILD_TESTS=ON
      - if: matrix.compiler == 'msvc'
        run: cmake -S . -B build -DCLAUDARIS_BUILD_TESTS=ON
      - run: cmake --build build --config ${{ matrix.build_type }} --parallel
      - run: ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure
  sanitizer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan
            flags: -fsanitize=address -fno-omit-frame-pointer
          - name: UBSan
            flags: -fsanitize=undefined -fno-sanitize-recover=all
    runs-on: ubuntu-latest
    name: GCC ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=Debug -DCLAUDARIS_BUILD_TESTS=ON -DCMAKE_C_FLAGS="${{ matrix.flags }}" -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.flags }}"
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
